<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-version" content="2026-11-26-classroom2">
<title>工廠 LIVE · Factory LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1b1a; --muted:#5b564e; --paper:#fbf8f2; --card:#ffffff; --line:#e3dccd; --soft:#f3eee3;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fdeadd; --dark:#26231f;
  --r:16px; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px rgba(60,40,10,.07);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5}
body{min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:30px;font-weight:800} h2{font-size:22px;font-weight:800} h3{font-size:18px;font-weight:700}
.muted{color:var(--muted)} .tiny{font-size:14px} .small{font-size:16px} .big{font-size:24px} .huge{font-size:44px;font-weight:800}
.num{font-variant-numeric:tabular-nums} .right{text-align:right} .center{text-align:center}
.row{display:flex;gap:12px;align-items:center} .row.wrap{flex-wrap:wrap} .grow{flex:1} .gap{gap:20px}
.stack>*+*{margin-top:14px}
.hidden{display:none!important}

/* ---------- shells */
.app{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.app.wide{max-width:1180px}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.brand{font-weight:800;font-size:20px;letter-spacing:.02em}
.brand i{display:inline-block;width:12px;height:12px;background:var(--accent);border-radius:3px;margin-right:8px;transform:translateY(1px)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700;font-size:15px;background:#fff}
.pill.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);display:inline-block}
.dot.off{background:transparent;border:2px solid var(--ink)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.card.accent{background:var(--accent-soft);border-color:#f0c9ad}
.card h2+*{margin-top:8px}
.banner{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;background:#fff}
.banner.warn{background:#fff3cd}
.sep{height:1.5px;background:var(--line);margin:14px 0}

/* ---------- controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 20px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:40px;padding:6px 14px;font-size:16px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line);font-weight:700}
.field{display:block}
.field>span{display:block;font-weight:700;margin-bottom:4px}
input[type=text],input[type=number],input[type=password],input[type=tel],select,textarea{width:100%;min-height:54px;padding:10px 14px;border:2px solid var(--ink);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .v{min-width:84px;text-align:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper .btn{min-width:64px;font-size:28px}
.seg{display:grid;gap:10px}
.seg.c5{grid-template-columns:repeat(5,1fr)} .seg.c2{grid-template-columns:1fr 1fr} .seg.c3{grid-template-columns:repeat(3,1fr)}
.seg .btn{min-height:68px;font-size:26px;flex-direction:column;gap:0;line-height:1.1}
.seg .btn small{font-size:13px;font-weight:600}
.seg .btn.on{background:var(--ink);color:#fff}
.seg .btn.on.acc{background:var(--accent);border-color:var(--accent)}

/* ---------- tables */
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 8px;border-bottom:1.5px solid var(--line);text-align:right;font-size:17px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:14px;color:var(--muted);font-weight:700}
table.t tr.hl td{background:var(--accent-soft);font-weight:800}
table.t tr.off td{color:#9a9488}
.sign{font-weight:800}

/* ---------- countdown */
.cd{color:var(--ink);border-radius:18px;padding:18px 10px;text-align:center;border:3px solid var(--ink);background:#fff}
.cd .n{font-size:96px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.cd .l{font-size:18px;font-weight:700;margin-top:6px}
.cd.pre{background:var(--ink);color:#fff}
.cd.run{background:var(--accent);border-color:var(--accent);color:#fff}
.cd.done{background:#fff;color:var(--ink)}
.cd.idle .n{font-size:40px}

/* ---------- factory icon */
.fac{width:100%;height:auto;display:block}
.smoke circle{fill:var(--ink);opacity:0}
.fac.open .smoke circle{animation:puff 2.6s infinite ease-out}
.fac.open .smoke circle:nth-child(2){animation-delay:.9s}
.fac.open .smoke circle:nth-child(3){animation-delay:1.8s}
@keyframes puff{0%{opacity:.5;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(10px,-34px) scale(1.5)}}
@media (prefers-reduced-motion:reduce){.fac.open .smoke circle{animation:none}.flip,.flip *{transition:none!important}}

/* ---------- tiles (projector + host) */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(var(--tile,190px),1fr))}
.tile{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 10px 12px;text-align:center}
.tile .nm{font-weight:800;font-size:20px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .sub{font-size:15px;color:var(--muted);font-weight:600}
.tile .tag{display:inline-block;margin-top:4px;padding:2px 12px;border-radius:999px;font-weight:800;font-size:16px;border:2px solid var(--ink)}
.tile.open{border-color:var(--accent)} .tile.open .tag{background:var(--accent);border-color:var(--accent);color:#fff}
.tile.stop .tag{background:#fff;color:var(--ink)}
.tile.exit{border-style:dashed;background:var(--soft)} .tile.exit .tag{background:var(--ink);color:#fff}
.tile.unk .tag{border-style:dashed;color:var(--muted);border-color:#b9b19f}
.tile .badge{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.tile .badge.off{background:#fff;color:var(--ink);border:2px dashed var(--ink)}
.flip{perspective:900px}
.flip .in{transition:transform .7s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.pre .in{transform:rotateY(90deg)}
.tile.mini{--tile:120px}
.bar{height:16px;border-radius:8px;background:var(--soft);border:1.5px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}

/* ---------- projector */
body.screen{background:#fbf8f2;font-size:22px}
.screenwrap{padding:22px 34px;min-height:100vh;display:flex;flex-direction:column;gap:18px}
.screenhead{display:flex;align-items:center;gap:18px}
.screenhead h1{font-size:44px}
.stepper-phase{display:flex;gap:8px;flex-wrap:wrap}
.stepper-phase .ph{padding:4px 14px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:17px;color:var(--muted);background:#fff}
.stepper-phase .ph.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stepper-phase .ph.done{border-color:var(--ink);color:var(--ink)}
.bigcode{font-size:150px;font-weight:900;letter-spacing:.12em;line-height:1}
.q-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.q-cards .card{text-align:center}
.q-cards .v{font-size:110px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.q-cards .k{font-size:24px;font-weight:700;color:var(--muted)}
.chartbox{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px}
svg text{font-family:var(--font)}

/* ---------- host */
.hostgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:980px){.hostgrid{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn{min-height:44px;font-size:16px}
.tabs .btn.on{background:var(--ink);color:#fff}
table.t.compact th,table.t.compact td{padding:5px 6px;font-size:15px}
.phasebar{display:flex;gap:6px;flex-wrap:wrap}
.phasebar .ph{padding:6px 12px;border-radius:10px;border:2px solid var(--line);font-weight:700;background:#fff;font-size:15px}
.phasebar .ph.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;border:1.5px solid var(--ink);font-size:14px;font-weight:800;background:#fff}
.chip.bad{background:var(--ink);color:#fff}
.chip.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.inl{width:76px;min-height:38px;padding:4px 8px;font-size:16px;text-align:right}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}

.tiles.many{gap:10px}.tiles.many .tile{padding:6px 6px 8px}.tiles.many .tile .fac{max-height:78px}.tiles.many .tile .nm{font-size:17px}

/* ---------- feedback / motion */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.fx-layer i{position:absolute;border-radius:2px;opacity:0;animation:confetti 1.4s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 220px)) rotate(var(--rot))}}
#app.phase-in>*{animation:phasein .45s ease both}
#app.phase-in .stack>*:nth-child(2),#app.phase-in .screenwrap>*:nth-child(2){animation-delay:.06s}
#app.phase-in .stack>*:nth-child(3),#app.phase-in .screenwrap>*:nth-child(3){animation-delay:.12s}
#app.phase-in .stack>*:nth-child(n+4),#app.phase-in .screenwrap>*:nth-child(n+4){animation-delay:.18s}
@keyframes phasein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn{transition:transform .12s,box-shadow .12s,background .15s}
.btn:not([disabled]):hover{box-shadow:0 3px 0 var(--ink);transform:translateY(-1px)}
.btn:not([disabled]):active{transform:translateY(2px) scale(.98);box-shadow:none}
.btn.primary:not([disabled]):hover{box-shadow:0 3px 0 #7c2d12}
.cd.hot{animation:hotpulse .5s ease-in-out infinite alternate}
@keyframes hotpulse{from{transform:scale(1)}to{transform:scale(1.045);box-shadow:0 0 0 6px rgba(194,65,12,.25)}}
.tile{transition:transform .2s,box-shadow .2s}
.tile.open{animation:tilepop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tilepop{from{transform:scale(.85)}to{transform:scale(1)}}
.chip.ok{animation:tilepop .4s cubic-bezier(.3,1.6,.5,1) both}
.toast{animation:toastin .3s cubic-bezier(.3,1.6,.5,1) both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px) scale(.9)}to{opacity:1}}
.peekbar{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- polish pass */
body{background:var(--paper) radial-gradient(circle at 1px 1px,rgba(120,53,15,.07) 1.2px,transparent 0) 0 0/26px 26px}
.card{box-shadow:0 1px 0 rgba(28,25,23,.04),0 10px 28px -14px rgba(120,53,15,.28);border-radius:20px}
.topbar{padding-bottom:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:4px;margin-right:0;box-shadow:0 0 0 4px var(--accent-soft)}
.lobby{display:flex;gap:30px;align-items:flex-start}
.lobby-card{width:min(440px,38vw);flex:none;background:#fff;border:1.5px solid var(--line);border-radius:28px;padding:26px 28px 22px;text-align:center;box-shadow:0 18px 40px -22px rgba(120,53,15,.45);display:flex;flex-direction:column;align-items:center;gap:14px}
.lc-kick{font-size:22px;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.qrframe{width:min(300px,100%);aspect-ratio:1;padding:12px;border-radius:20px;background:#fff;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--accent)}
.qrframe svg{display:block;width:100%;height:100%}
.lc-or{width:100%;display:flex;align-items:center;gap:12px;color:#57534e;font-size:16px;font-weight:700}
.lc-or:before,.lc-or:after{content:"";flex:1;height:1.5px;background:var(--line)}
.codeboxes{display:flex;gap:10px;justify-content:center}
.codeboxes b{width:clamp(48px,5vw,72px);height:clamp(60px,6.6vw,92px);display:flex;align-items:center;justify-content:center;font-size:clamp(34px,4vw,58px);font-weight:900;background:var(--ink);color:#fff;border-radius:14px;box-shadow:0 5px 0 #44403c}
.lc-url{font-size:15px;color:#57534e;word-break:break-all}
.lobby-h{font-size:36px;margin:0}
.lobby-empty{border:2.5px dashed var(--line);border-radius:28px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.55)}
.lobby-empty .le-fac{width:170px;opacity:.55;animation:bob 2.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.bigcode{font-size:clamp(48px,9vw,150px);letter-spacing:.06em;max-width:100%;overflow:hidden}

/* ---------- QA pass 2 */
.cd .n{white-space:nowrap}
.cd.done .n,.cd.idle .n{font-size:64px}
.cd.done .l{white-space:nowrap}
.chartbox.mkt svg{max-height:calc(100vh - 600px);min-height:300px}
.tile .tag.neg{background:#fff!important;color:var(--accent)!important;border-color:var(--accent)!important}
.t.plan{font-size:15px}.t.plan th{white-space:nowrap;font-size:12px;vertical-align:bottom}.t.plan th small{font-size:11px;font-weight:600}
.t.plan td,.t.plan th{padding-left:4px;padding-right:4px}
.seg.c5 .btn{white-space:nowrap;padding-left:2px;padding-right:2px}
.card.center .muted.small{white-space:nowrap}
.seg.c5 .btn{font-size:24px}

/* Reliable actions and readable phone drafts. */
.action-error{position:fixed;z-index:100;left:16px;right:16px;bottom:16px;max-width:540px;margin:auto;padding:14px 48px 14px 16px;border:2px solid var(--accent);border-radius:14px;background:#fff5ef;box-shadow:var(--shadow);font-size:16px;max-height:40vh;overflow:auto}
.action-error .error-close{position:absolute;top:5px;right:5px;min-width:32px;padding:2px 8px}
.action-error details{font-size:13px;margin-top:8px}.action-error pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.saving{border-color:var(--muted)!important}.save-state{display:block;line-height:1.3}.save-failed,[aria-invalid=true]{color:var(--accent);border-color:var(--accent)!important}
input.inl,select.inl{width:76px;min-height:38px;padding:4px 8px;font-size:16px}
.topbar .brand{white-space:nowrap;flex-shrink:0}.topbar .pill{white-space:nowrap;font-size:13px;padding:3px 8px}.topbar .btn{flex-shrink:0}
@media(max-width:440px){.topbar{gap:7px}.topbar .brand{font-size:17px}.topbar .brand i{width:11px;height:11px}.topbar .btn.sm{padding:6px 10px}.topbar .grow{min-width:0}.topbar .pill{font-size:11px}}
.cd.done .n,.cd.idle .n{font-size:clamp(34px,6vw,54px);white-space:normal}.cd.done .l{white-space:normal}

/* A complete projection canvas, with explicit pages for larger classes. */
.screenwrap{height:100vh;min-height:0;padding:18px 26px;gap:12px;overflow:hidden}
.screenhead{flex:none;min-height:42px}.stepper-phase{flex:none;flex-wrap:nowrap;gap:5px}.stepper-phase .ph{font-size:15px;padding:3px 10px;white-space:nowrap}
.screenbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.screenbody .stack{display:flex;flex-direction:column;gap:12px;min-height:0}.screenbody .stack>*+*{margin-top:0}
.screenbody>.row.gap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:stretch!important;gap:16px}
.screenbody>.row.gap>*{width:auto!important;min-width:0;min-height:0}
.screenbody .huge{font-size:clamp(28px,2.4vw,42px);overflow-wrap:anywhere}.screenbody .big{font-size:clamp(18px,1.5vw,24px)}
.screenbody .card.dark.row>.grow{min-width:0}.screenbody .card.dark.row>div:last-child{width:260px!important;flex:none}
.screenbody .cd{padding:10px 8px}.screenbody .cd .n{font-size:68px}.screenbody .cd.done .n,.screenbody .cd.idle .n{font-size:clamp(30px,2.7vw,44px);white-space:normal;line-height:1.05}.screenbody .cd .l{font-size:15px;white-space:normal;line-height:1.25}
.screenbody .q-cards{gap:12px;flex:none}.screenbody .q-cards .card{padding:12px}.screenbody .q-cards .v{font-size:76px}.screenbody .q-cards .k{font-size:20px}
.screenbody .chartbox{display:flex;flex-direction:column;flex:1;min-height:0}.screenbody .chartbox svg{display:block;flex:1;width:100%;height:100%;min-height:0}.screenbody .chartbox.mkt svg{max-height:none;min-height:0}
.screenbody .tile-panel{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.screenbody .tiles{flex:1;min-height:0;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.screenbody .tiles.few{flex:0 0 auto;grid-auto-rows:180px}
.screenbody .tile{padding:6px;min-width:0;min-height:0}.screenbody .tile .fac{max-height:66px}.screenbody .tile .nm{font-size:17px}.screenbody .tile .sub{font-size:14px}.screenbody .tile .tag{font-size:14px;padding:1px 8px}.screenbody .tile .badge{width:22px;height:22px;top:4px;right:4px;font-size:13px}
.screenbody .tile .in{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%}
.screenbody .tile .in>*{flex-shrink:0}.screenbody .tile .nm{line-height:1.4;min-height:1.4em;max-width:100%}.screenbody .tile .fac{flex-basis:66px;height:66px}
.tile-pagination{display:flex;align-items:center;justify-content:center;gap:14px;font-size:15px;flex:none}.tile-pagination .btn{min-height:30px;padding:2px 12px}
.histogram{display:flex;gap:4px;margin:10px 0 8px}.hist-bin{flex:1;min-width:0;text-align:center;font-size:15px}.hist-track{height:110px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}.hist-track>div{width:70%;border-radius:3px 3px 0 0}
.lesson .banner{font-size:20px}.lesson .small{font-size:18px}.lesson .tiny{font-size:14px}
.screenbody .lobby{flex:1;min-height:0;gap:20px}.screenbody .lobby>.stack{height:100%}.screenbody .lobby-card{max-height:100%;padding:20px;gap:12px}.screenbody .lobby-h{font-size:30px}
@media(min-width:1000px) and (max-height:800px){
 .screenwrap{padding:12px 20px;gap:8px}.screenhead{min-height:38px;gap:12px}.screenhead .pill{font-size:20px!important}.screenhead .brand{font-size:20px}.stepper-phase .ph{font-size:13px;padding:2px 9px}

  FL.afterTeam = function () {

/* Factory LIVE — projector screen. Large text, shape + words (never colour alone). */
(function () {
  'use strict';
  var FL = window.FL, C = window.FLCalc, t = FL.t, esc = FL.esc, sg = FL.sg;
  var PH = C.PHASES;
  var flip = { from: null, armed: false };
  var tilePage = 0, PAGE_SIZE = 20;

  function head(snap) {
    var cur = PH.indexOf(snap.session.phase);
    var steps = PH.map(function (p, i) { return '<span class="ph ' + (i === cur ? 'on' : i < cur ? 'done' : '') + '">' + t('ph_' + p) + '</span>'; }).join('');
    return '<div class="screenhead"><div class="brand big"><i></i>' + t('app_title') + '</div><div class="grow"></div>' +
      '<span class="pill solid" style="font-size:24px">' + t('room_code') + ' ' + esc(snap.session.code) + '</span>' +

  }

  // tile state for the current phase
  function tileInfo(snap, tm) {
    var ph = snap.session.phase, d1 = C.decisionOf(snap.decisions, tm.id, 1), d2 = C.decisionOf(snap.decisions, tm.id, 2);
    var lockedFor = function (per) { return snap.locked.some(function (x) { return x.team_id === tm.id && x.period === per; }); };
    var led = (/^(ledger|debrief)/.test(ph)) ? C.ledger(tm, snap) : null;
    var o = { state: 'unk', L: 0, tag: '', badge: '', sub: t('table_n', tm.table_no) + ' · ' + t('k_people', tm.present) };
    if (ph === 'lobby') { o.state = 'stop'; o.tag = t('k_people', tm.present); }
    else if (ph === 'trial' || ph === 'market') {
      var pts = C.trialPoints(snap.runs, tm.id), n = Object.keys(pts).length;

    else if (ph === 'decide1') { o.state = 'unk'; o.tag = lockedFor(1) ? t('locked') : t('thinking'); o.badge = lockedFor(1) ? '✓' : '…'; o.off = !lockedFor(1); }
    else if (ph === 'decide2') {
      if (d1) { o.state = d1.L > 0 ? 'open' : 'stop'; o.L = d1.L; }
      o.tag = lockedFor(2) ? t('locked') : t('thinking'); o.badge = lockedFor(2) ? '✓' : '…'; o.off = !lockedFor(2);
    }
    else if (ph === 'run1' || ph === 'ledger1') {
      if (d1) { o.state = d1.L > 0 ? 'open' : 'stop'; o.L = d1.L; o.tag = d1.L > 0 ? t('open_n', d1.L) : t('stop'); }
      else { o.tag = t('no_dec_short'); }
      if (ph === 'ledger1' && led && led.periods[1].complete) o.tag = sg(led.periods[1].profit);
    }
    else { // run2, ledger2, debrief
      if (d2) { o.state = d2.renew ? (d2.L > 0 ? 'open' : 'stop') : 'exit'; o.L = d2.L; o.tag = d2.renew ? t('renew_n', d2.L) : t('exit'); }
      else o.tag = t('no_dec_short');
      if (/^(ledger2|debrief)/.test(ph) && led && led.periods[2].complete) o.tag = sg(led.periods[2].profit);
    }
    // production progress badge
    if (/^run/.test(ph) && o.state === 'open') {
      var kind = ph === 'run1' ? 'p1' : 'p2', r = snap.runs.filter(function (x) { return x.team_id === tm.id && x.kind === kind; })[0];
      o.badge = r ? (r.status === 'confirmed' || r.status === 'host' ? '✓' : '·') : '…'; o.off = !(r && (r.status === 'confirmed' || r.status === 'host'));
    }
    if (ph === 'trial') {
      var sh = FL.shiftOf(snap);
      if (sh) {
        var rr = snap.runs.filter(function (x) { return x.team_id === tm.id && x.kind === 'trial' && x.L === sh.L; })[0];
        if (tm.present < sh.L) { o.badge = '–'; o.off = true; o.tag = t('k_short'); }
        else { o.badge = rr ? (rr.status === 'confirmed' || rr.status === 'host' ? '✓' : '·') : '…'; o.off = !(rr && (rr.status === 'confirmed' || rr.status === 'host')); if (rr) o.tag = rr.q + ' ' + t('rings'); }
      }

  }

  function tiles(snap, mini) {
    var list = FL.active(snap);
    var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE)); tilePage = Math.min(tilePage, pages - 1);
    var visible = list.slice(tilePage * PAGE_SIZE, (tilePage + 1) * PAGE_SIZE);
    var tilesz = list.length > 12 ? 140 : list.length > 6 ? 165 : 220;
    var cols = visible.length > 12 ? 5 : visible.length > 6 ? 4 : visible.length > 3 ? 3 : Math.max(visible.length, 1);
    return '<div class="tile-panel"><div class="tiles' + (list.length > 6 ? ' many' : '') + (visible.length <= 3 ? ' few' : '') + '" style="--tile:' + tilesz + 'px;--cols:' + cols + '">' + visible.map(function (tm) {
      var o = tileInfo(snap, tm), pre = flip.armed && /^run/.test(snap.session.phase);
      return '<div class="tile ' + o.state + ' flip ' + (pre ? 'pre' : '') + '"><div class="in">' +
        (o.badge ? '<div class="badge ' + (o.off ? 'off' : '') + '">' + o.badge + '</div>' : '') +

        '<div class="nm" title="' + esc(tm.name) + '">' + esc(tm.name) + '</div><div class="sub">' + o.sub + '</div><div class="tag' + (/^−/.test(o.tag) ? ' neg' : '') + '">' + esc(o.tag) + '</div></div></div>';
    }).join('') + '</div>' + (pages > 1 ? '<div class="tile-pagination"><button class="btn sm" data-act="tilepage" data-d="-1"' + (!tilePage ? ' disabled' : '') + '>←</button><span>' + t('tile_page', tilePage + 1, pages) + '</span><button class="btn sm" data-act="tilepage" data-d="1"' + (tilePage === pages - 1 ? ' disabled' : '') + '>→</button></div>' : '') + '</div>';
  }
  FL.acts.tilepage = function (el) { tilePage = Math.max(0, tilePage + Number(el.dataset.d)); FL.render(true); };

  /* ------------------------------------------------ chart: trial points + class mean */
  function trialChart(snap) {
    var act = FL.active(snap), W = 640, H = 380, m = { l: 56, r: 20, t: 42, b: 48 };
    var byL = { 1: [], 2: [], 3: [], 4: [] }, series = [];
    act.forEach(function (tm) { var pts = C.trialPoints(snap.runs, tm.id); series.push(pts); for (var L = 1; L <= 4; L++) if (pts[L] != null) byL[L].push(pts[L]); });
    var maxQ = 1; for (var L0 = 1; L0 <= 4; L0++) byL[L0].forEach(function (q) { if (q > maxQ) maxQ = q; });
    maxQ = Math.ceil((maxQ + 1) / 2) * 2;
    var x = function (L) { return m.l + (W - m.l - m.r) * (L / 4); }, y = function (q) { return H - m.b - (H - m.t - m.b) * (q / maxQ); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + t('chart_alt') + '">';
    s += '<text x="' + m.l + '" y="22" font-size="18" fill="#5b564e">' + t('chart_y', snap.session.params.secs) + '</text>';
    for (var g = 0; g <= maxQ; g += maxQ <= 10 ? 2 : 4) s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="#e3dccd" stroke-width="2"/><text x="' + (m.l - 10) + '" y="' + (y(g) + 6) + '" text-anchor="end" font-size="18" fill="#5b564e">' + g + '</text>';
    for (var L = 0; L <= 4; L++) s += '<text x="' + x(L) + '" y="' + (H - 18) + '" text-anchor="middle" font-size="20" fill="#1c1b1a" font-weight="700">' + L + '</text>';
    s += '<text x="' + (W / 2) + '" y="' + (H - 0) + '" text-anchor="middle" font-size="16" fill="#5b564e">' + t('c_workers') + '</text>';
    series.forEach(function (pts) {
      var path = 'M' + x(0) + ' ' + y(0), any = false;
      for (var L = 1; L <= 4; L++) if (pts[L] != null) { path += ' L' + x(L) + ' ' + y(pts[L]); any = true; }
      if (any) s += '<path d="' + path + '" fill="none" stroke="#9a9488" stroke-width="2" opacity=".6"/>';
      for (var L2 = 1; L2 <= 4; L2++) if (pts[L2] != null) s += '<circle cx="' + x(L2) + '" cy="' + y(pts[L2]) + '" r="6" fill="#fff" stroke="#1c1b1a" stroke-width="2.5"/>';
    });

  /* ================================================ rehearsal bots */
  var NAMES = ['白頭翁', '赤燕', '白鷺', '藍鵲', '黃鸝', '紫鳩', '灰鶯', '橘雀', '翠鳥', '鐵匠', '鉛筆', '墨水', '星火', '浪花', '山茶', '木棉'];
  var bots = [], doneKeys = {};
  function loadBots() { try { bots = JSON.parse(FL.ls.get('fl_bots_' + (FL.host ? FL.host.code : '')) || '[]'); } catch (e) { bots = []; } }
  function saveBots() { FL.ls.set('fl_bots_' + FL.host.code, JSON.stringify(bots)); }
  FL.bots = { list: function () { return bots; } };
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function qEst(id, L) {

    return Math.max(1, Math.round(a * Math.pow(L, b) + n * 0.6));
  }
  FL.acts.hbots = function (el) {

    for (var i = 0; i < n; i++) {
      (function () {
        while (used[tbl]) tbl++;
        var table = tbl; used[table] = 1;
        var name; do { name = NAMES[ni % NAMES.length] + (ni >= NAMES.length ? Math.floor(ni / NAMES.length) + 1 : ''); ni++; } while (nameUsed[name]); nameUsed[name] = 1;
        var present = 2 + (hash(name) % 3);

  function isBot(id) { return bots.some(function (b) { return b.team_id === id; }); }
  function botOf(id) { return bots.filter(function (b) { return b.team_id === id; })[0]; }
  function later(key, fn) {

  }
  function botPoints(snap, tm) {
    var pts = C.trialPoints(snap.runs, tm.id), out = {};

  function botTick() {
    var snap = FL.snap(); if (!snap || !FL.host || !bots.length || FL.route().role !== 'host') return;
    var ph = snap.session.phase, par = snap.session.params, act = FL.active(snap);
    var live = bots.filter(function (b) { return FL.team(snap, b.team_id); });
    if (!live.length) return;
    var sh = FL.shiftOf(snap), st = FL.shiftState(sh);

    // 1. bots verify their neighbours once the shift is over
    if (sh && st.st === 'done' && (ph === 'trial' || ph === 'run1' || ph === 'run2')) {
      act.forEach(function (tg) {
        var v = C.verifierOf(tg, snap.teams); if (!v || !isBot(v.id)) return;

        if (ph === 'trial') { kind = 'trial'; L = sh.L; if (tg.present < L) return; }
        else { var per = ph === 'run1' ? 1 : 2, d = C.decisionOf(snap.decisions, tg.id, per); if (!d || !d.renew || d.L < 1) return; kind = 'p' + per; L = d.L; }
        if (snap.runs.some(function (r) { return r.team_id === tg.id && r.kind === kind && r.L === L; })) return;
        var b = botOf(v.id);
        later('rep:' + sh.id + ':' + tg.id, function () { return FL.api.report(b.team_id, b.token, tg.id, kind, L, qEst(tg.id, L)).then(function () { return FL.store.refresh(); }); });
      });
    }
    // 2. bots confirm what neighbours reported about them
    live.forEach(function (b) {
      snap.runs.forEach(function (r) {
        if (r.team_id === b.team_id && r.status === 'reported') later('cf:' + b.team_id + ':' + r.kind + r.L + ':' + r.q, function () { return FL.api.confirm(b.team_id, b.token, r.kind, r.L, true).then(function () { return FL.store.refresh(); }); });
      });
    });
    // 3. bots decide
    if (ph === 'decide1' || ph === 'decide2') {
      var per2 = ph === 'decide1' ? 1 : 2;
      live.forEach(function (b) {
        var tm = FL.team(snap, b.team_id); if (!tm || tm.present < 1) return;
        if (snap.locked.some(function (x) { return x.team_id === tm.id && x.period === per2; })) return;
        later('dec:' + ph + ':' + tm.id, function () {
          var bp = C.bestPlan(botPoints(snap, tm), par.p, par.w), h = hash(tm.id + ph), L = bp.L;
          if (h % 7 === 0) L = Math.max(0, Math.min(tm.present, L + (h % 2 ? 1 : -1)));
          if (per2 === 1) return FL.api.submit(tm.id === b.team_id ? b.team_id : tm.id, b.token, 1, true, L, null).then(function () { return FL.store.refresh(); });
          var renew = bp.G > par.F ? (h % 10 !== 0) : (h % 10 === 0), nOpen = snap.teams.filter(function (x) { var d = C.decisionOf(snap.decisions, x.id, 1); return d && d.L > 0; }).length;
          var pred = Math.max(0, Math.min(nOpen, Math.round(nOpen * 0.4) + (h % 3) - 1));
          return FL.api.submit(b.team_id, b.token, 2, renew, renew ? Math.max(L, 1) : 0, pred).then(function () { return FL.store.refresh(); });
        });
      });
    }
  }
  setInterval(botTick, 1200);
  FL.store.on(function () { botTick(); });
  FL.bots.reload = loadBots; FL.bots.tick = botTick;
  loadBots();
})();

/* Factory LIVE — visual / haptic feedback. Pure decoration: nothing here changes game state. */
(function () {
  'use strict';
  var FL = window.FL, fx = FL.fx = {};
  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }

  fx.buzz = function (ms) { try { if (!reduced && navigator.vibrate) navigator.vibrate(ms || 30); } catch (e) { /* ignore */ } };

  var COLORS = ['#c2410c', '#1c1917', '#f59e0b', '#ea580c', '#78716c'];
  fx.confetti = function (x, y, n) {
    if (reduced) return;
    n = n || 26;
    var host = document.createElement('div');
    host.className = 'fx-layer';
    for (var i = 0; i < n; i++) {
      var s = document.createElement('i');
      var ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 150;
      s.style.cssText = 'left:' + x + 'px;top:' + y + 'px;background:' + COLORS[i % COLORS.length] +
        ';--dx:' + Math.round(Math.cos(ang) * dist) + 'px;--dy:' + Math.round(Math.sin(ang) * dist - 90) + 'px;--rot:' + Math.round(Math.random() * 720 - 360) + 'deg;' +
        'animation-delay:' + Math.round(Math.random() * 90) + 'ms;width:' + (6 + Math.random() * 7) + 'px;height:' + (9 + Math.random() * 8) + 'px';
      host.appendChild(s);
    }
    document.body.appendChild(host);
    setTimeout(function () { if (host.parentNode) host.parentNode.removeChild(host); }, 1700);
  };
  fx.rain = function () { // projector celebration: several bursts across the top
    var w = window.innerWidth;
    [0.2, 0.5, 0.8].forEach(function (f, i) { setTimeout(function () { fx.confetti(w * f, window.innerHeight * 0.25, 30); }, i * 220); });
  };

  function countUp(el) {
    var txt = el.textContent.trim(), m = /^([+−-]?)(\d+)$/.exec(txt);
    if (!m || el.children.length) return;
    var target = +m[2], neg = m[1] === '−' || m[1] === '-', plus = m[1] === '+';
    if (target < 2) return;
    var t0 = null, dur = 650;
    function step(ts) {
      if (t0 == null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur), v = Math.round(target * (1 - Math.pow(1 - k, 3)));
      el.textContent = (v ? (neg ? '−' : plus ? '+' : '') : '') + v;
      if (k < 1) requestAnimationFrame(step);
    }
    el.textContent = '0';
    requestAnimationFrame(step);
  }

  var lastKey = null;
  function afterRender() {
    var r = FL.route(), snap = FL.snap();
    if (!snap || (r.role !== 'team' && r.role !== 'screen')) { lastKey = null; return; }
    var ph = snap.session.phase, key = r.role + ':' + ph;
    if (key === lastKey) return;
    var first = lastKey === null;
    lastKey = key;
    var app = FL.$('#app');
    if (!app) return;
    app.classList.remove('phase-in'); void app.offsetWidth; app.classList.add('phase-in'); clearTimeout(fx._pi); fx._pi = setTimeout(function () { app.classList.remove('phase-in'); }, 700);
    if (first || reduced) return;
    // Financial amounts stay exact; do not animate through misleading intermediate values.
    if (ph === 'ledger1' || ph === 'ledger2' || ph === 'debrief') {
      if (r.role === 'screen' && snap.decisions.length) { if (FL.soundOn && FL.beep) { FL.beep(660, 0.12); setTimeout(function () { FL.beep(880, 0.25); }, 140); } }
      else if (FL.me && FL.C) {
        try {
          var me = FL.team(snap, FL.me.team_id), P = window.FLCalc.ledger(me, snap).periods[ph === 'ledger2' ? 2 : 1];
          if (P && P.complete && P.profit > 0) { fx.confetti(window.innerWidth / 2, 160, 34); fx.buzz([40, 40, 80]); }
          else fx.buzz(40);
        } catch (e) { /* ignore */ }
      }
    } else if (r.role === 'team' && (ph === 'trial' || ph === 'decide1' || ph === 'decide2' || ph === 'run1' || ph === 'run2')) {
      fx.buzz(30);
    }
  }
  var baseRender = FL.render;
  FL.render = function (force) { baseRender(force); try { afterRender(); } catch (e) { /* ignore */ } };

  // last-3-seconds pulse on the countdown
  var baseTick = FL.tick;
  FL.tick = function () {
    baseTick();
    try {
      var snap = FL.snap(); if (!snap) return;
      var st = FL.shiftState(FL.shiftOf(snap)), hot = st.st === 'run' && st.n <= 3;
      FL.$$('[data-cd]').forEach(function (b) { b.classList.toggle('hot', hot); });
      if (hot && st.n !== fx._lastHot) { fx._lastHot = st.n; fx.buzz(20); }
    } catch (e) { /* ignore */ }
  };

  // click feedback: confetti when a team locks in / confirms a count
  function wrapAct(name, n, ms) {
    var o = FL.acts[name]; if (!o) return;
    FL.acts[name] = function (el, e) {
      var res = o(el, e);
      if (res && typeof res.then === 'function') res.then(function (done) {
        if (!done || !done.ok) return;
        if (e && e.clientX != null) fx.confetti(e.clientX, e.clientY, n);
        fx.buzz(ms);
      });
      return res;
    };
  }
  wrapAct('lock1', 22, 50); wrapAct('lock2', 22, 50); wrapAct('confirm', 12, 30); wrapAct('report', 8, 25);
})();

/* Factory LIVE — home, boot, event delegation. */
(function () {
  'use strict';
  var FL = window.FL, t = FL.t;
  FL.views = FL.views || {};
  FL.changes = FL.changes || {};

  FL.views.home = function () {
    return '<div class="app home-app"><div class="topbar"><div class="brand"><i></i>' + t('home_kicker') + '</div><div class="grow"></div><button class="btn sm ghost" data-act="lang">' + (FL.lang === 'zh' ? 'EN' : '中') + '</button></div>' +
      '<div class="stack"><div class="card home-hero stack"><div class="home-factory">' + FL.factory('open', 3, { label: t('app_title') }) + '</div><h1>' + t('app_title') + '</h1><h2>' + t('home_question') + '</h2><div class="muted">' + t('home_intro') + '</div><div class="home-steps">' + t('home_steps') + '</div>' +
      (FL.useLocal ? '<div class="banner warn small">' + t('local_banner') + '</div>' : '') + '</div>' +
      '<a class="btn primary block role-link" href="#/team"><span>' + t('home_team') + '<small>' + t('home_team_hint') + '</small></span><b aria-hidden="true">→</b></a>' +
      '<a class="btn block role-link" href="#/screen"><span>' + t('home_screen') + '<small>' + t('home_screen_hint') + '</small></span><b aria-hidden="true">→</b></a>' +
      '<a class="btn block role-link" href="#/host"><span>' + t('home_host') + '<small>' + t('home_host_hint') + '</small></span><b aria-hidden="true">→</b></a></div></div>';
  };

  FL.boot = function () {
    var r = FL.route();
    FL.store.stop(); FL.store.snap = null; FL.store.code = null;
    if (r.role === 'team') {
      if (FL.me && r.code && FL.me.code !== r.code) { FL.me = null; FL.ls.del('fl_me'); }
      if (FL.me) FL.store.start(FL.me.code, 2000);
    } else if (r.role === 'screen') {
      if (r.code) FL.store.start(r.code, 1500);
    } else if (r.role === 'host') {
      if (FL.host) { FL.store.start(FL.host.code, 1500); FL.bots.reload(); }
    }
    if (FL.store.code && !FL.useLocal && !FL._rt) { FL._rt = true; FL.store.enableRealtime(FL.cfg); }
    FL.render(true);
  };

  FL.onShiftState = function () { FL.render(false); };

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.disabled) return;
    var f = FL.acts[b.dataset.act];
    if (f) {
      var result = f(b, e);
      if (result && typeof result.then === 'function') {
        b.disabled = true; b.setAttribute('aria-busy', 'true');
        result.finally(function () { b.disabled = false; b.removeAttribute('aria-busy'); });
      }
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, name = el && el.dataset && el.dataset.change;
    if (name && FL.changes[name]) FL.changes[name](el, e);
  });

  document.documentElement.lang = FL.lang === 'zh' ? 'zh-Hant' : 'en';
  FL.boot();
})();

</script>
</body>

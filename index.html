<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-version" content="2026-11-27-roster1">
<title>Factory LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1b1a; --muted:#5b564e; --paper:#fbf8f2; --card:#ffffff; --line:#e3dccd; --soft:#f3eee3;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fdeadd; --dark:#26231f;
  --r:16px; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px rgba(60,40,10,.07);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5}
body{min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:30px;font-weight:800} h2{font-size:22px;font-weight:800} h3{font-size:18px;font-weight:700}
.muted{color:var(--muted)} .tiny{font-size:14px} .small{font-size:16px} .big{font-size:24px} .huge{font-size:44px;font-weight:800}
.num{font-variant-numeric:tabular-nums} .right{text-align:right} .center{text-align:center}
.row{display:flex;gap:12px;align-items:center} .row.wrap{flex-wrap:wrap} .grow{flex:1} .gap{gap:20px}
.stack>*+*{margin-top:14px}
.hidden{display:none!important}

/* ---------- shells */
.app{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.app.wide{max-width:1180px}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.brand{font-weight:800;font-size:20px;letter-spacing:.02em}
.brand i{display:inline-block;width:12px;height:12px;background:var(--accent);border-radius:3px;margin-right:8px;transform:translateY(1px)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700;font-size:15px;background:#fff}
.pill.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);display:inline-block}
.dot.off{background:transparent;border:2px solid var(--ink)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.card.accent{background:var(--accent-soft);border-color:#f0c9ad}
.card h2+*{margin-top:8px}
.banner{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;background:#fff}
.banner.warn{background:#fff3cd}
.sep{height:1.5px;background:var(--line);margin:14px 0}

/* ---------- controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 20px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:40px;padding:6px 14px;font-size:16px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line);font-weight:700}
.field{display:block}
.field>span{display:block;font-weight:700;margin-bottom:4px}
input[type=text],input[type=number],input[type=password],input[type=tel],select,textarea{width:100%;min-height:54px;padding:10px 14px;border:2px solid var(--ink);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .v{min-width:84px;text-align:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper .btn{min-width:64px;font-size:28px}
.seg{display:grid;gap:10px}
.seg.c5{grid-template-columns:repeat(5,1fr)} .seg.c2{grid-template-columns:1fr 1fr} .seg.c3{grid-template-columns:repeat(3,1fr)}
.seg .btn{min-height:68px;font-size:26px;flex-direction:column;gap:0;line-height:1.1}
.seg .btn small{font-size:13px;font-weight:600}
.seg .btn.on{background:var(--ink);color:#fff}
.seg .btn.on.acc{background:var(--accent);border-color:var(--accent)}

/* ---------- tables */
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 8px;border-bottom:1.5px solid var(--line);text-align:right;font-size:17px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:14px;color:var(--muted);font-weight:700}
table.t tr.hl td{background:var(--accent-soft);font-weight:800}
table.t tr.off td{color:#9a9488}
.sign{font-weight:800}

/* ---------- countdown */
.cd{color:var(--ink);border-radius:18px;padding:18px 10px;text-align:center;border:3px solid var(--ink);background:#fff}
.cd .n{font-size:96px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.cd .l{font-size:18px;font-weight:700;margin-top:6px}
.cd.pre{background:var(--ink);color:#fff}
.cd.run{background:var(--accent);border-color:var(--accent);color:#fff}
.cd.done{background:#fff;color:var(--ink)}
.cd.idle .n{font-size:40px}

/* ---------- factory icon */
.fac{width:100%;height:auto;display:block}
.smoke circle{fill:var(--ink);opacity:0}
.fac.open .smoke circle{animation:puff 2.6s infinite ease-out}
.fac.open .smoke circle:nth-child(2){animation-delay:.9s}
.fac.open .smoke circle:nth-child(3){animation-delay:1.8s}
@keyframes puff{0%{opacity:.5;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(10px,-34px) scale(1.5)}}
@media (prefers-reduced-motion:reduce){.fac.open .smoke circle{animation:none}.flip,.flip *{transition:none!important}}

/* ---------- tiles (projector + host) */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(var(--tile,190px),1fr))}
.tile{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 10px 12px;text-align:center}
.tile .nm{font-weight:800;font-size:20px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .sub{font-size:15px;color:var(--muted);font-weight:600}
.tile .tag{display:inline-block;margin-top:4px;padding:2px 12px;border-radius:999px;font-weight:800;font-size:16px;border:2px solid var(--ink)}
.tile.open{border-color:var(--accent)} .tile.open .tag{background:var(--accent);border-color:var(--accent);color:#fff}
.tile.stop .tag{background:#fff;color:var(--ink)}
.tile.exit{border-style:dashed;background:var(--soft)} .tile.exit .tag{background:var(--ink);color:#fff}
.tile.unk .tag{border-style:dashed;color:var(--muted);border-color:#b9b19f}
.tile .badge{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.tile .badge.off{background:#fff;color:var(--ink);border:2px dashed var(--ink)}
.flip{perspective:900px}
.flip .in{transition:transform .7s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.pre .in{transform:rotateY(90deg)}
.tile.mini{--tile:120px}
.bar{height:16px;border-radius:8px;background:var(--soft);border:1.5px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}

/* ---------- projector */
body.screen{background:#fbf8f2;font-size:22px}
.screenwrap{padding:22px 34px;min-height:100vh;display:flex;flex-direction:column;gap:18px}
.screenhead{display:flex;align-items:center;gap:18px}
.screenhead h1{font-size:44px}
.stepper-phase{display:flex;gap:8px;flex-wrap:wrap}
.stepper-phase .ph{padding:4px 14px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:17px;color:var(--muted);background:#fff}
.stepper-phase .ph.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stepper-phase .ph.done{border-color:var(--ink);color:var(--ink)}
.bigcode{font-size:150px;font-weight:900;letter-spacing:.12em;line-height:1}
.q-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.q-cards .card{text-align:center}
.q-cards .v{font-size:110px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.q-cards .k{font-size:24px;font-weight:700;color:var(--muted)}
.chartbox{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px}
svg text{font-family:var(--font)}

/* ---------- host */
.hostgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:980px){.hostgrid{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn{min-height:44px;font-size:16px}
.tabs .btn.on{background:var(--ink);color:#fff}
table.t.compact th,table.t.compact td{padding:5px 6px;font-size:15px}
.phasebar{display:flex;gap:6px;flex-wrap:wrap}
.phasebar .ph{padding:6px 12px;border-radius:10px;border:2px solid var(--line);font-weight:700;background:#fff;font-size:15px}
.phasebar .ph.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;border:1.5px solid var(--ink);font-size:14px;font-weight:800;background:#fff}
.chip.bad{background:var(--ink);color:#fff}
.chip.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.inl{width:76px;min-height:38px;padding:4px 8px;font-size:16px;text-align:right}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}

.tiles.many{gap:10px}.tiles.many .tile{padding:6px 6px 8px}.tiles.many .tile .fac{max-height:78px}.tiles.many .tile .nm{font-size:17px}

/* ---------- feedback / motion */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.fx-layer i{position:absolute;border-radius:2px;opacity:0;animation:confetti 1.4s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 220px)) rotate(var(--rot))}}
#app.phase-in>*{animation:phasein .45s ease both}
#app.phase-in .stack>*:nth-child(2),#app.phase-in .screenwrap>*:nth-child(2){animation-delay:.06s}
#app.phase-in .stack>*:nth-child(3),#app.phase-in .screenwrap>*:nth-child(3){animation-delay:.12s}
#app.phase-in .stack>*:nth-child(n+4),#app.phase-in .screenwrap>*:nth-child(n+4){animation-delay:.18s}
@keyframes phasein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn{transition:transform .12s,box-shadow .12s,background .15s}
.btn:not([disabled]):hover{box-shadow:0 3px 0 var(--ink);transform:translateY(-1px)}
.btn:not([disabled]):active{transform:translateY(2px) scale(.98);box-shadow:none}
.btn.primary:not([disabled]):hover{box-shadow:0 3px 0 #7c2d12}
.cd.hot{animation:hotpulse .5s ease-in-out infinite alternate}
@keyframes hotpulse{from{transform:scale(1)}to{transform:scale(1.045);box-shadow:0 0 0 6px rgba(194,65,12,.25)}}
.tile{transition:transform .2s,box-shadow .2s}
.tile.open{animation:tilepop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tilepop{from{transform:scale(.85)}to{transform:scale(1)}}
.chip.ok{animation:tilepop .4s cubic-bezier(.3,1.6,.5,1) both}
.toast{animation:toastin .3s cubic-bezier(.3,1.6,.5,1) both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px) scale(.9)}to{opacity:1}}
.peekbar{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- polish pass */
body{background:var(--paper) radial-gradient(circle at 1px 1px,rgba(120,53,15,.07) 1.2px,transparent 0) 0 0/26px 26px}
.card{box-shadow:0 1px 0 rgba(28,25,23,.04),0 10px 28px -14px rgba(120,53,15,.28);border-radius:20px}
.topbar{padding-bottom:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:4px;margin-right:0;box-shadow:0 0 0 4px var(--accent-soft)}
.lobby{display:flex;gap:30px;align-items:flex-start}
.lobby-card{width:min(440px,38vw);flex:none;background:#fff;border:1.5px solid var(--line);border-radius:28px;padding:26px 28px 22px;text-align:center;box-shadow:0 18px 40px -22px rgba(120,53,15,.45);display:flex;flex-direction:column;align-items:center;gap:14px}
.lc-kick{font-size:22px;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.qrframe{width:min(300px,100%);aspect-ratio:1;padding:12px;border-radius:20px;background:#fff;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--accent)}
.qrframe svg{display:block;width:100%;height:100%}
.lc-or{width:100%;display:flex;align-items:center;gap:12px;color:#57534e;font-size:16px;font-weight:700}
.lc-or:before,.lc-or:after{content:"";flex:1;height:1.5px;background:var(--line)}
.codeboxes{display:flex;gap:10px;justify-content:center}
.codeboxes b{width:clamp(48px,5vw,72px);height:clamp(60px,6.6vw,92px);display:flex;align-items:center;justify-content:center;font-size:clamp(34px,4vw,58px);font-weight:900;background:var(--ink);color:#fff;border-radius:14px;box-shadow:0 5px 0 #44403c}
.lc-url{font-size:15px;color:#57534e;word-break:break-all}
.lobby-h{font-size:36px;margin:0}
.lobby-empty{border:2.5px dashed var(--line);border-radius:28px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.55)}
.lobby-empty .le-fac{width:170px;opacity:.55;animation:bob 2.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.bigcode{font-size:clamp(48px,9vw,150px);letter-spacing:.06em;max-width:100%;overflow:hidden}

/* ---------- QA pass 2 */
.cd .n{white-space:nowrap}
.cd.done .n,.cd.idle .n{font-size:64px}
.cd.done .l{white-space:nowrap}
.chartbox.mkt svg{max-height:calc(100vh - 600px);min-height:300px}
.tile .tag.neg{background:#fff!important;color:var(--accent)!important;border-color:var(--accent)!important}
.t.plan{font-size:15px}.t.plan th{white-space:normal;font-size:12px;vertical-align:bottom}.t.plan th small{font-size:11px;font-weight:600}
.t.plan td,.t.plan th{padding-left:4px;padding-right:4px}
.seg.c5 .btn{white-space:nowrap;padding-left:2px;padding-right:2px}
.card.center .muted.small{white-space:nowrap}
.seg.c5 .btn{font-size:24px}

/* Reliable actions and readable phone drafts. */
.action-error{position:fixed;z-index:100;left:16px;right:16px;bottom:16px;max-width:540px;margin:auto;padding:14px 48px 14px 16px;border:2px solid var(--accent);border-radius:14px;background:#fff5ef;box-shadow:var(--shadow);font-size:16px;max-height:40vh;overflow:auto}
.action-error .error-close{position:absolute;top:5px;right:5px;min-width:32px;padding:2px 8px}
.action-error details{font-size:13px;margin-top:8px}.action-error pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.saving{border-color:var(--muted)!important}.save-state{display:block;line-height:1.3}.save-failed,[aria-invalid=true]{color:var(--accent);border-color:var(--accent)!important}
input.inl,select.inl{width:76px;min-height:38px;padding:4px 8px;font-size:16px}
.topbar .brand{white-space:nowrap;flex-shrink:0}.topbar .pill{white-space:nowrap;font-size:13px;padding:3px 8px}.topbar .btn{flex-shrink:0}
@media(max-width:440px){.topbar{gap:7px}.topbar .brand{font-size:17px}.topbar .brand i{width:11px;height:11px}.topbar .btn.sm{padding:6px 10px}.topbar .grow{min-width:0}.topbar .pill{font-size:11px}}
.cd.done .n,.cd.idle .n{font-size:clamp(34px,6vw,54px);white-space:normal}.cd.done .l{white-space:normal}

/* A complete projection canvas, with explicit pages for larger classes. */
.screenwrap{height:100vh;min-height:0;padding:18px 26px;gap:12px;overflow:hidden}
.screenhead{flex:none;min-height:42px}.stepper-phase{flex:none;flex-wrap:nowrap;gap:5px}.stepper-phase .ph{font-size:15px;padding:3px 10px;white-space:nowrap}
.screenbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.screenbody .stack{display:flex;flex-direction:column;gap:12px;min-height:0}.screenbody .stack>*+*{margin-top:0}
.screenbody>.row.gap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:stretch!important;gap:16px}
.screenbody>.row.gap>*{width:auto!important;min-width:0;min-height:0}
.screenbody .huge{font-size:clamp(28px,2.4vw,42px);overflow-wrap:anywhere}.screenbody .big{font-size:clamp(18px,1.5vw,24px)}
.screenbody .card.dark.row>.grow{min-width:0}.screenbody .card.dark.row>div:last-child{width:260px!important;flex:none}
.screenbody .cd{padding:10px 8px}.screenbody .cd .n{font-size:68px}.screenbody .cd.done .n,.screenbody .cd.idle .n{font-size:clamp(30px,2.7vw,44px);white-space:normal;line-height:1.05}.screenbody .cd .l{font-size:15px;white-space:normal;line-height:1.25}
.screenbody .q-cards{gap:12px;flex:none}.screenbody .q-cards .card{padding:12px}.screenbody .q-cards .v{font-size:76px}.screenbody .q-cards .k{font-size:20px}
.screenbody .chartbox{display:flex;flex-direction:column;flex:1;min-height:0}.screenbody .chartbox svg{display:block;flex:1;width:100%;height:100%;min-height:0}.screenbody .chartbox.mkt svg{max-height:none;min-height:0}
.screenbody .tile-panel{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.screenbody .tiles{flex:1;min-height:0;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.screenbody .tiles.few{flex:0 0 auto;grid-auto-rows:180px}
.screenbody .tile{padding:6px;min-width:0;min-height:0}.screenbody .tile .fac{max-height:66px}.screenbody .tile .nm{font-size:17px}.screenbody .tile .sub{font-size:14px}.screenbody .tile .tag{font-size:14px;padding:1px 8px}.screenbody .tile .badge{width:22px;height:22px;top:4px;right:4px;font-size:13px}
.screenbody .tile .in{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%}
.screenbody .tile .in>*{flex-shrink:0}.screenbody .tile .nm{line-height:1.4;min-height:1.4em;max-width:100%}.screenbody .tile .fac{flex-basis:66px;height:66px}
.tile-pagination{display:flex;align-items:center;justify-content:center;gap:14px;font-size:15px;flex:none}.tile-pagination .btn{min-height:30px;padding:2px 12px}
.histogram{display:flex;gap:4px;margin:10px 0 8px}.hist-bin{flex:1;min-width:0;text-align:center;font-size:15px}.hist-track{height:110px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}.hist-track>div{width:70%;border-radius:3px 3px 0 0}
.lesson .banner{font-size:20px}.lesson .small{font-size:18px}.lesson .tiny{font-size:14px}
.screenbody .lobby{flex:1;min-height:0;gap:20px}.screenbody .lobby>.stack{height:100%}.screenbody .lobby-card{max-height:100%;padding:20px;gap:12px}.screenbody .lobby-h{font-size:30px}
@media(min-width:1000px) and (max-height:800px){
 .screenwrap{padding:12px 20px;gap:8px}.screenhead{min-height:38px;gap:12px}.screenhead .pill{font-size:20px!important}.screenhead .brand{font-size:20px}.stepper-phase .ph{font-size:13px;padding:2px 9px}

.card{border-color:rgba(120,90,50,.10)}
.card.accent{border-color:transparent;background:linear-gradient(180deg,#fdebdc,#fbe3d0)}
.num,.q-cards .v,.huge.num,.profit-value,.cd .n,.codeboxes b,.feature-duel b,.plot-values,.stat .n{font-family:var(--num);font-feature-settings:"tnum" 1;letter-spacing:-.01em}

/* ---------- living factories */
.fac .win{transition:fill .35s}
.fac.open .win.on{animation:winglow 2.8s ease-in-out infinite;animation-delay:calc(var(--wi) * -.7s)}
@keyframes winglow{0%,100%{fill:var(--accent)}50%{fill:#e0601f}}
.fac .smoke circle{fill:#8a8378;opacity:0;transform-box:fill-box;transform-origin:center}
.fac.open .smoke circle{animation:smokeup 3s infinite ease-out}
.fac.open .smoke circle:nth-child(2){animation-delay:1s}.fac.open .smoke circle:nth-child(3){animation-delay:2s}
@keyframes smokeup{0%{opacity:0;transform:translate(0,6px) scale(.5)}15%{opacity:.55}100%{opacity:0;transform:translate(14px,-22px) scale(1.7)}}
body[data-shift="run"] .fac.open .smoke circle{animation-duration:1.4s}
.fac .belt{animation:belt 1.2s linear infinite;animation-play-state:paused}
body[data-shift="run"] .fac .belt{animation-play-state:running}
@keyframes belt{to{stroke-dashoffset:-22}}
body[data-shift="run"] .tile.open .fac{animation:hum .22s steps(2) infinite}
@keyframes hum{50%{transform:translateY(-1px)}}
.fac .shutter{animation:shutterdown .7s var(--ease-out) both;transform-box:fill-box;transform-origin:top}
@keyframes shutterdown{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fac .lease-sign{animation:sign 1.6s .6s ease-in-out both;transform-box:fill-box;transform-origin:50% 0}
@keyframes sign{0%{opacity:0;transform:rotate(-30deg)}30%{opacity:1;transform:rotate(14deg)}55%{transform:rotate(-7deg)}75%{transform:rotate(3deg)}100%{transform:rotate(0)}}
.fac .qmark{animation:qbob 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes qbob{50%{transform:translateY(-3px) rotate(6deg)}}
.tile.exit{background:#f1ece2}
.tile.idle .fac{opacity:.92}

/* ---------- shift stage: progress bar + running stripes */
.shift-stage{position:relative;overflow:hidden}
.shift-stage::after{content:"";position:absolute;left:0;bottom:0;height:8px;width:calc(var(--shift-prog,0) * 100%);background:#fff;opacity:.85;transition:width .2s linear}
body[data-shift="run"] .shift-stage{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 18px,transparent 18px 36px);background-size:51px 51px;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:51px 0}}
body[data-shift="done"] .shift-stage::after{background:var(--accent)}

/* ---------- rubber stamps */
.stamp{display:inline-flex;align-items:center;justify-content:center;gap:.3em;font-weight:900;letter-spacing:.12em;color:var(--accent);border:3px solid currentColor;border-radius:8px;padding:.18em .6em;transform:rotate(-6deg);line-height:1.2;white-space:nowrap;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px currentColor;background:rgba(255,255,255,.35);
  -webkit-mask-image:radial-gradient(circle at 30% 40%,#000 55%,rgba(0,0,0,.82) 70%,#000 85%);mask-image:radial-gradient(circle at 30% 40%,#000 55%,rgba(0,0,0,.82) 70%,#000 85%)}
.stamp.sm{font-size:15px;padding:.12em .5em;border-width:2.5px;box-shadow:inset 0 0 0 1.5px #fff,inset 0 0 0 3px currentColor}
.stamp.big{font-size:22px}
.stamp.ink{color:var(--ink)}
.stamp.slam-wait{opacity:0}
.stamp.slam{animation:slam .42s var(--ease-out) both}
@keyframes slam{0%{opacity:0;transform:rotate(-14deg) scale(2.6)}55%{opacity:1;transform:rotate(-5deg) scale(.92)}75%{transform:rotate(-6deg) scale(1.04)}100%{transform:rotate(-6deg) scale(1)}}
.confirmed-card{gap:12px;align-items:center}
.class-aha.slam-wait{opacity:0}
.class-aha.slam{animation:ahain .55s var(--ease-out) both}
@keyframes ahain{0%{opacity:0;transform:translateY(10px) scale(.96)}100%{opacity:1;transform:none}}

/* ---------- receipt (phone ledger) */
.receipt{position:relative;background:#fffdf7;margin:18px 2px 14px;padding:22px 20px 18px;box-shadow:0 14px 26px -14px rgba(80,45,10,.35),0 1px 0 rgba(0,0,0,.04);font-family:var(--mono)}
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:10px;background:linear-gradient(-45deg,transparent 7px,#fffdf7 0) 0 0/14px 10px,linear-gradient(45deg,transparent 7px,#fffdf7 0) 0 0/14px 10px}
.receipt::before{top:-10px;transform:scaleY(-1)}
.receipt::after{bottom:-10px}
.receipt-head{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding-bottom:12px;border-bottom:2px dashed #cfc5b4;margin-bottom:8px}
.receipt-head b{font-family:var(--font);font-size:15px;letter-spacing:.08em}.receipt-head span{font-weight:700;font-size:15px;text-align:right}.receipt-head small{grid-column:1/-1;color:var(--muted);font-size:12px}
.receipt-lines{font-size:15px}.receipt-lines td{border-bottom:1px dotted #d8cfbf;padding:7px 2px}.receipt-lines td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.receipt-total{display:flex;align-items:baseline;justify-content:space-between;border-top:3px double var(--ink);margin-top:10px;padding-top:8px}
.receipt-total span{font-family:var(--font);font-weight:800}.receipt-total .profit-value{font-size:52px;line-height:1}
.receipt.good .receipt-total .profit-value{color:var(--accent)}
.receipt-stamp{display:flex;justify-content:flex-end;margin:10px -4px 2px}
.receipt-note{font-family:var(--font);font-size:14px;color:var(--muted);margin-top:10px}
.g-vs-f{margin-top:6px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-weight:600}

/* ---------- split-flap numbers */
.flapnum{display:inline-block;width:auto;max-width:100%;min-width:1.2ch;line-height:1.05;vertical-align:baseline;transform-origin:50% 55%}
.flapnum.flapping{background:linear-gradient(180deg,#2a2723 0 49%,#141210 51%);color:#fff;border-radius:.14em;padding:0 .14em;box-shadow:0 .06em 0 #000}
.flapnum.flip-tick{animation:fliptick .07s linear}
@keyframes fliptick{0%{transform:perspective(300px) rotateX(-70deg)}100%{transform:none}}
.flapnum.landed{animation:land .45s var(--ease-out)}
@keyframes land{0%{transform:scale(1.18);color:var(--accent)}100%{transform:none}}

/* ---------- sequential reveal on the projector */
.chart-comparison.revealing .profit-segment{animation:grow .55s var(--ease-out) both;animation-delay:calc(.35s + var(--ri,0) * .11s);transform-origin:left}
.chart-comparison.revealing .profit-segment.worse{transform-origin:right}
.chart-comparison.revealing .actual-dot,.chart-comparison.revealing .plot-values{animation:fadein .3s both;animation-delay:calc(.75s + var(--ri,0) * .11s)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.histogram.revealing .hist-bar{animation:rise .6s var(--ease-out) both;transform-origin:bottom}
.histogram.revealing .hist-bin:nth-child(2n) .hist-bar{animation-delay:.08s}.histogram.revealing .hist-bin:nth-child(3n) .hist-bar{animation-delay:.16s}
.histogram.revealing .actual-exit-line{animation:drop .5s 1.2s cubic-bezier(.5,0,.75,0) both;transform-origin:top}
.histogram.revealing .actual-exit-label{animation:fadein .3s 1.6s both}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drop{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hist-bar{background:#cfc6b6!important}.actual-bin .hist-bar{background:var(--accent)!important}
.actual-exit-label{background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;transform:translateX(-50%) rotate(-4deg)}

/* ---------- small touches */
.sfx-toggle{padding:6px 9px;display:inline-flex;align-items:center}
.sfx-toggle[aria-pressed="false"]{opacity:.55}
.toast{bottom:auto;top:14px;animation:toastdown .3s var(--ease-out) both}
@keyframes toastdown{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translateX(-50%)}}
.btn.primary:not([disabled]){background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.06))}
.q-cards .v{display:block}

@media (prefers-reduced-motion:reduce){
  .fac *,.tile .fac,.shift-stage,.stamp,.receipt *,.chart-comparison *,.histogram *{animation:none!important;transition:none!important}
  .stamp.slam-wait,.class-aha.slam-wait{opacity:1}
}

.receipt-vs{font-family:var(--font);font-size:15px;font-weight:700;margin-top:10px;padding:8px 10px;background:var(--soft);border-radius:8px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.receipt-stamp .stamp{max-width:100%;white-space:normal;text-align:center}

/* ---------- English-first typography: no lonely last words, no hard-split buttons */
h1,h2,h3,.btn,.stamp,.banner,.class-aha,.lc-kick,th,.receipt-head span,.pill{text-wrap:balance}
p,.muted,.small,.tiny,.receipt-note,.receipt-vs,.g-vs-f,.card>div,label span,li,td{text-wrap:pretty}
.btn{hyphens:manual;overflow-wrap:normal;word-break:normal}
html[lang="en"] .t th{white-space:normal;overflow-wrap:normal;word-break:normal;line-height:1.15}
@media(max-width:380px){.topbar .brand{font-size:0;gap:0}.topbar .brand i{margin:0}.topbar{gap:6px}.topbar .btn.sm{padding:6px 8px}}

.t.plan td:last-child{white-space:nowrap}
.card,.card.small{text-wrap:pretty}
@media(max-width:380px){
  .stepper{gap:6px}.stepper .btn{min-width:0;flex:1 1 0;padding-left:4px;padding-right:4px;font-size:24px}.stepper .v{min-width:56px;font-size:40px}
  .t.plan{font-size:14px}.t.plan th{font-size:11px}.t.plan td,.t.plan th{padding-left:3px;padding-right:3px}
  .seg.c5{gap:5px}.seg.c5 .btn{font-size:21px}.seg.c5 .btn small,.seg.c5 .btn .sub{font-size:10px}
}

/* projector tiles: names may take two lines instead of being cut to a few letters */
.screenbody .tile .nm,.screenbody .tiles.many .tile .nm{white-space:normal;text-overflow:clip;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:normal;word-break:normal;text-wrap:balance;line-height:1.12;min-height:0;max-height:2.3em}
.screenbody .tile .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.count-row{flex-wrap:nowrap;max-width:100%}
@media(max-width:400px){.count-row{gap:6px!important}.count-row .btn{flex:1 1 0;min-width:0;padding-left:4px;padding-right:4px}.count-row .v{min-width:64px!important;font-size:42px!important}}
@media(max-width:1440px){
  .screenbody .tiles.many .tile .in{grid-template-columns:minmax(36px,30%) minmax(0,1fr);column-gap:6px}
  .screenbody .tiles.many .tile .nm{font-size:14.5px;letter-spacing:-.01em}
}

/* ---------- assigned class list */
.roster-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.roster-board.many{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.roster-cell{border:2.5px dashed #c9bfae;border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.55);color:#57534e;min-width:0}
.roster-cell .rc-t{font-size:15px;font-weight:700;letter-spacing:.02em}
.roster-cell .rc-n{font-size:clamp(20px,2.1vw,34px);font-weight:900;line-height:1.1;color:var(--ink);opacity:.72;overflow-wrap:anywhere;text-wrap:balance}
.roster-cell .rc-s{font-size:14px;font-weight:700;margin-top:4px}
.roster-cell.in{border:3px solid var(--accent);background:#fff;color:var(--ink);box-shadow:0 8px 18px -12px rgba(120,53,15,.5);animation:tilepop .45s cubic-bezier(.3,1.6,.5,1) both}
.roster-cell.in .rc-n{opacity:1}.roster-cell.in .rc-s{color:var(--accent)}
.roster-tip{font-size:18px;margin:-4px 0 2px}
@media(max-height:760px){.roster-board.many{gap:7px}.roster-cell{padding:6px 9px;border-radius:12px}.roster-cell .rc-n{font-size:22px}.roster-cell .rc-t,.roster-cell .rc-s{font-size:13px}}
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 12px}
.roster-row{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:8px}
.roster-row .rt{font-weight:700;font-size:14px}.roster-row .rs{font-size:12px;color:var(--muted);white-space:nowrap}
.roster-row.joined .rs{color:var(--accent);font-weight:800}.roster-row input{width:100%;min-width:0}

</style>

  /* ------------------------------------------------ trial */

  function statusChip(s) {

  }

  // Neighbour verification (I count them) + my own confirmation (they counted me)
  function verifyBlock(snap, me, kind, L) {
    var teams = snap.teams, out = '';
    var assigned = C.verifierOf(me, teams), shift = FL.shiftOf(snap), context = shift ? shift.id : kind + ':' + L;
    var ownDecision = kind === 'trial' ? null : C.decisionOf(snap.decisions, me.id, kind === 'p1' ? 1 : 2);
    var needsOwn = kind === 'trial' ? me.present >= L : !!(ownDecision && ownDecision.renew && ownDecision.L > 0);
    if (U.countContext !== context) { U.cnt = {}; U.countContext = context; }
    out += '<div class="card small">' + (needsOwn ? (assigned ? t('your_verifier', esc(assigned.name), assigned.table_no) : t('need_teacher_verifier')) : t('verify_others_only')) + '</div>';
    var targets = C.verifies(me, teams).filter(function (tg) {
      if (kind === 'trial') return tg.present >= L;
      var per = kind === 'p1' ? 1 : 2, d = C.decisionOf(snap.decisions, tg.id, per);
      return d && d.renew && d.L > 0;
    });
    var st = FL.shiftState(FL.shiftOf(snap));
    var counting = st.st === 'done' || st.st === 'idle';

    // mine to confirm
    var mine = needsOwn ? snap.runs.filter(function (r) { return r.team_id === me.id && r.kind === kind && (kind !== 'trial' || r.L === L); }) : [];
    mine.forEach(function (r) {

        out += '<div class="card accent stack"><h3>' + t('confirm_h') + '</h3><div class="big">' + t('confirm_p', '<b class="num">' + r.q + '</b>') + '</div>' +

          '<button class="btn" data-act="confirm" data-kind="' + kind + '" data-lv="' + r.L + '" data-ok="0">' + t('confirm_no') + '</button></div></div>';
      } else if (r.status === 'confirmed' || r.status === 'host') {
        out += '<div class="card row confirmed-card"><span class="stamp sm" data-sk="conf' + kind + ':' + r.L + ':' + r.q + '">' + t('stamp_confirmed') + '</span><span>' + t('confirmed_p', '<b class="num">' + r.q + '</b>') + '</span></div>';
      }
    });

      out += '<div class="card stack"><h3>' + t('verify_h', esc(tg.name), tg.table_no) + '</h3><div class="muted small">' + t('verify_p', useL) + '</div>' +
        (counting ? '' : '<div class="banner small">' + t('verify_after') + '</div>') +
        stepperCnt(tg.id, cur) +
        '<button class="btn primary block" data-act="report" data-target="' + tg.id + '" data-kind="' + kind + '" data-lv="' + useL + '"' + (counting ? '' : ' disabled') + '>' + (run ? t('report_again') : t('report_btn')) + '</button>' +

  }

  function decide(snap, me, per) {
    var par = snap.session.params, K = me.present, mine = myDecision(snap, per), pts = C.trialPoints(snap.runs, me.id);
    var out = '';
    if (per === 1) {
      var sel = U.sel1 != null ? U.sel1 : (mine ? mine.L : null);
      out += '<div class="card accent stack"><h2>' + t('d1_h') + '</h2>' + paramCards(par) + '<div>' + t('d1_p', par.F) + '</div></div>';
      out += '<div class="card stack"><h3>' + t('plan_h') + '</h3>' + planTable(snap, me, sel) + '</div>';
      var btns = ''; for (var L = 0; L <= K; L++) btns += '<button class="btn ' + (sel === L ? 'on acc' : '') + '" data-act="sel1" data-lv="' + L + '">' + (L === 0 ? t('stop') : L) + '<small>' + (L === 0 ? '0 ' + t('people') : t(L === 1 ? 'person' : 'people')) + '</small></button>';
      out += '<div class="card stack"><h3>' + t('d1_q') + '</h3><div class="seg c5" style="grid-template-columns:repeat(' + Math.min(5, K + 1) + ',1fr)">' + btns + '</div>' + previewBlock(par, pts, sel, 1) + lockBtn(mine, sel != null, 'lock1') + '</div>';
    } else {
      var renew = U.renew2 != null ? U.renew2 : (mine ? mine.renew : null);
      var L2 = U.sel2 != null ? U.sel2 : (mine ? mine.L : null);
      var N = openCount(snap), pred = U.pred != null ? U.pred : (mine && mine.predict != null ? mine.predict : 0);
      pred = Math.max(0, Math.min(pred, Math.max(N, 0)));
      out += '<div class="card accent stack"><h2>' + t('d2_h') + '</h2>' + paramCards(par) + '<div>' + t('d2_p', par.F) + '</div></div>';
      var gRows = C.planRows(pts, par.p, par.w), gBest = gRows.length > 1 ? Math.max.apply(null, gRows.map(function (r) { return r.net; })) : null;
      out += '<div class="card stack"><h3>' + t('plan_h') + '</h3>' + planTable(snap, me, renew ? L2 : null) + (gBest != null ? '<div class="g-vs-f">' + t('g_vs_f', '<b>' + sg(gBest) + '</b>', '<b>' + par.F + '</b>') + '</div>' : '') + '</div>';
      out += '<div class="card stack"><h3>' + t('d2_q') + '</h3><div class="seg c2">' +
        '<button class="btn ' + (renew === true ? 'on acc' : '') + '" data-act="renew" data-v="1">' + t('renew') + '<small>' + t('pay_f', par.F) + '</small></button>' +
        '<button class="btn ' + (renew === false ? 'on' : '') + '" data-act="renew" data-v="0">' + t('exit') + '<small>' + t('profit_0') + '</small></button></div>';

/* Factory LIVE — projector screen. Large text, shape + words (never colour alone). */

    var led = (/^(ledger|debrief)/.test(ph)) ? C.ledger(tm, snap) : null;
    var o = { state: 'unk', L: 0, tag: '', badge: '', sub: t('table_n', tm.table_no) + ' · ' + t('k_people', tm.present) };
    if (ph === 'lobby') { o.state = 'idle'; o.sub = t('table_n', tm.table_no); o.tag = t('k_people', tm.present); }
    else if (ph === 'trial' || ph === 'market') {

      return '<div class="profit-plot-row" data-choice="'+r.choice+'" data-team="'+esc(r.team.id)+'" data-actual="'+(r.actual==null?'':r.actual)+'" data-alternative="'+(r.alternative==null?'':r.alternative)+'" data-delta="'+(r.delta==null?'':r.delta)+'" title="'+esc(description)+'" aria-label="'+esc(r.team.name+' '+description)+'"><span class="plot-name">'+tag+'<span class="plot-label" title="'+esc(r.team.name)+'">'+r.team.table_no+' · '+esc(r.team.name)+'</span></span>'+track+'</div><span class="plot-values">'+(r.delta==null?'—':sg(r.delta)+(r.estimated?'*':''))+'</span></div>';

    var headline = per===1 ? t(working.length && workBetter===working.length?'all_open_better':'open_better',workBetter) : t('choices_helped',better);
    if(!comparable.length)headline=t('waiting_comparison');

    whoosh: function () { noise(0.32, 0.18, 'bandpass', 400, 2600, 0, 1.4); },
    shutter: function () { for (var i = 0; i < 9; i++) noise(0.05, 0.22, 'bandpass', 900 - i * 60, 0, i * 0.055, 3); tone('sine', 90, 60, 0.2, 0.4, 0.5); },
    pop: function (d) { tone('sine', 420, 760, 0.07, 0.18, d); },
    shift: function (st, s) {
      if (st.st === 'pre') sfx.tick(false);
      else if (st.st === 'run' && st.n === s.secs) sfx.bell();
      else if (st.st === 'run' && st.n <= 3) sfx.tick(true);
      else if (st.st === 'done') sfx.horn();
    },
    toggleHTML: function () {
      var on = !muted();
      return '<button class="btn sm ghost sfx-toggle" data-act="sfxtoggle" aria-pressed="' + on + '" aria-label="' + FL.t(on ? 'sound_mute' : 'sound_unmute') + '" title="' + FL.t(on ? 'sound_mute' : 'sound_unmute') + '">' +
        '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>' + (on ? '<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' : '<path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>') + '</svg></button>';
    }
  };

  // Projector: reuse the existing "enable sound" button, but route it through this engine.
  FL.enableSound = function () {
    if (!ctx()) { FL.soundOn = false; return; }
    if (ac.state === 'suspended') ac.resume();
    FL.soundOn = true; FL.ls.del && FL.ls.del('fl_sfx_mute'); sfx.chime(); FL.render(true);
  };
  FL.beep = function (f, d) { tone('sine', f, 0, d || 0.15, 0.25); };
  FL.acts.sfxtoggle = function () {
    if (muted()) { FL.ls.del('fl_sfx_mute'); if (ctx()) { if (ac.state === 'suspended') ac.resume(); FL.soundOn = true; sfx.pop(); } }
    else FL.ls.set('fl_sfx_mute', '1');
    FL.render(true);
  };
  // Phones: audio unlocks on the first tap (browsers require a gesture); every button press gets a soft click.
  document.addEventListener('pointerdown', function (e) {
    if (role() === 'screen' || muted()) return;
    if (!ctx()) return;
    if (ac.state === 'suspended') ac.resume();
    FL.soundOn = true;
    var b = e.target && e.target.closest && e.target.closest('button,.btn');
    if (b && !b.disabled && b.dataset.act !== 'sfxtoggle') sfx.click();
  }, true);

  function buzz(p) { try { if (!reduced && navigator.vibrate) navigator.vibrate(p); } catch (e) { /* ignore */ } }

  /* ------------------------------------------------------------------ stamps */
  var seen = {}, booted = false;
  function slamStamps() {
    var list = FL.$$('[data-sk]'), fresh = [];
    list.forEach(function (el) {
      var k = role() + ':' + el.getAttribute('data-sk');
      if (!seen[k]) { seen[k] = 1; if (booted) fresh.push(el); }
    });
    fresh.forEach(function (el, i) {
      var delay = (el.closest('.chart-comparison') ? revealSpan() : 0) + i * 120;
      if (reduced) return;
      el.classList.add('slam-wait');
      setTimeout(function () {
        el.classList.remove('slam-wait'); el.classList.add('slam');
        var r = role(), isLedger = /^led/.test(el.getAttribute('data-sk'));
        if (r === 'team') {
          if (isLedger) { if (el.closest('.receipt.good')) { sfx.stamp(); setTimeout(sfx.coin, 160); buzz([30, 40, 70]); } else { sfx.stamp(); buzz(60); } }
          else { sfx.stamp(); buzz(35); }
        } else sfx.stamp();
      }, delay);
    });
  }

  /* ------------------------------------------------------------------ split-flap numbers */
  function flap(el, delay) {
    var final = el.textContent.trim();
    if (!/^\d+$/.test(final) || reduced) return;
    var width = final.length, steps = 8 + Math.round(Math.random() * 3), n = 0;
    // Animate an inline tile that hugs the digits; the card element itself keeps its layout.
    var tile = document.createElement('span');
    tile.className = 'flapnum flapping'; tile.textContent = '-'.repeat(width);
    el.textContent = ''; el.appendChild(tile);
    setTimeout(function () {
      var timer = setInterval(function () {
        n++;
        if (!tile.isConnected) { clearInterval(timer); return; }
        var v = n >= steps ? final : String(Math.floor(Math.random() * Math.pow(10, width))).padStart(width, '0');
        tile.textContent = v; tile.classList.remove('flip-tick'); void tile.offsetWidth; tile.classList.add('flip-tick');
        if (role() === 'screen') sfx.flap();
        if (n >= steps) {
          clearInterval(timer); tile.classList.remove('flapping', 'flip-tick'); tile.classList.add('landed');
          if (role() === 'screen') sfx.pop();
          setTimeout(function () { if (tile.isConnected) el.textContent = final; }, 600);
        }
      }, 70);
    }, delay);
  }
  function flapMarket() {
    var els = FL.$$('.q-cards .v').length && FL.route().role === 'screen' ? FL.$$('.q-cards .v') : FL.$$('.market-params .huge.num, .seg.c3 .huge.num');
    els.forEach(function (el, i) { flap(el, i * 380); });
    if (role() === 'screen') setTimeout(sfx.chime, els.length * 380 + 800);
    else buzz([20, 60, 20, 60, 20]);
  }

  /* ------------------------------------------------------------------ sequential reveal (projector) */
  function revealSpan() { var n = FL.$$('.chart-comparison .profit-plot-row').length; return Math.min(2600, 500 + n * 110); }
  function revealComparison() {
    var rows = FL.$$('.chart-comparison .profit-plot-row');
    if (!rows.length || reduced) return;
    var card = FL.$('.chart-comparison'); card.classList.add('revealing');
    rows.forEach(function (row, i) {
      row.style.setProperty('--ri', i);
      if (role() === 'screen') setTimeout(function () { sfx.pop(0); }, 450 + i * 110);
    });
    setTimeout(function () { card.classList.remove('revealing'); card.classList.add('revealed'); }, revealSpan() + 400);
  }
  function revealDebrief() {
    var h = FL.$('.histogram'); if (!h || reduced) return;
    h.classList.add('revealing');
    var line = FL.$('.actual-exit-line');
    if (line && role() === 'screen') setTimeout(function () { sfx.thud(); }, 1300);
    setTimeout(function () { h.classList.remove('revealing'); }, 2400);
  }

  /* ------------------------------------------------------------------ hooks */
  var last = { key: null, pub: null, shiftSt: null };
  var baseRender = FL.render;
  FL.render = function (force) {
    baseRender(force);
    try { after(); } catch (e) { /* decoration must never break the app */ }
  };
  function after() {
    var snap = FL.snap(), r = role();
    document.body.classList.toggle('reduced', reduced);
    if (!snap) { booted = true; slamStamps(); return; }
    var ph = snap.session.phase, key = r + ':' + snap.session.code + ':' + ph, pub = FL.marketPublished ? !!FL.marketPublished(snap) : true;
    var first = last.key === null, changed = key !== last.key;
    document.body.setAttribute('data-phase', ph);
    if (!first && changed) {
      if (r === 'screen') {
        if (/^ledger/.test(ph)) revealComparison();
        else if (ph === 'debrief') revealDebrief();
        else if (ph === 'run2') { if (FL.$$('.tile.exit').length) setTimeout(sfx.shutter, 300); else sfx.whoosh(); }
        else sfx.whoosh();
      }
    }
    if (!first && ph === 'market' && pub && last.pub === false) flapMarket();
    last.key = key; last.pub = ph === 'market' ? pub : null;
    slamStamps();
    booted = true;
  }

  // Shift stage: drive a progress bar + "machine running" state through CSS variables.
  var baseTick = FL.tick;
  FL.tick = function () {
    baseTick();
    try {
      var snap = FL.snap(); if (!snap) return;
      var s = FL.shiftOf(snap), st = FL.shiftState(s), b = document.body;
      if (b.getAttribute('data-shift') !== st.st) b.setAttribute('data-shift', st.st);
      var frac = 0;
      if (s && st.st === 'run') frac = Math.max(0, Math.min(1, (FL.store.serverNow() - s.starts_at) / (s.ends_at - s.starts_at)));
      else if (st.st === 'done') frac = 1;
      document.documentElement.style.setProperty('--shift-prog', frac.toFixed(3));
      if (st.st !== last.shiftSt) {
        if (last.shiftSt && st.st === 'run' && role() === 'team') buzz([80]);
        if (last.shiftSt === 'run' && st.st === 'done' && role() === 'team') buzz([60, 50, 60]);
        last.shiftSt = st.st;
      }
    } catch (e) { /* ignore */ }
  };
})();

/* Factory LIVE — home, boot, event delegation. */
(function () {
  'use strict';
  var FL = window.FL, t = FL.t;
  FL.views = FL.views || {};
  FL.changes = FL.changes || {};

  FL.views.home = function () {
    return '<div class="app home-app"><div class="topbar"><div class="brand"><i></i>' + t('home_kicker') + '</div><div class="grow"></div><button class="btn sm ghost" data-act="lang" aria-label="' + t('lang_switch') + '" lang="' + (FL.lang === 'zh' ? 'en' : 'zh') + '">' + (FL.lang === 'zh' ? 'EN' : 'ZH') + '</button></div>' +
      '<div class="stack"><div class="card home-hero stack"><div class="home-factory">' + FL.factory('open', 3, { label: t('app_title') }) + '</div><h1>' + t('app_title') + '</h1><h2>' + t('home_question') + '</h2><div class="muted">' + t('home_intro') + '</div><div class="home-steps">' + t('home_steps') + '</div>' +
      (FL.useLocal ? '<div class="banner warn small">' + t('local_banner') + '</div>' : '') + '</div>' +
      '<a class="btn primary block role-link" href="#/team"><span>' + t('home_team') + '<small>' + t('home_team_hint') + '</small></span><b aria-hidden="true">→</b></a>' +
      '<a class="btn block role-link" href="#/screen"><span>' + t('home_screen') + '<small>' + t('home_screen_hint') + '</small></span><b aria-hidden="true">→</b></a>' +
      '<a class="btn block role-link" href="#/host"><span>' + t('home_host') + '<small>' + t('home_host_hint') + '</small></span><b aria-hidden="true">→</b></a></div></div>';
  };

  FL.boot = function () {
    var r = FL.route();
    FL.store.stop(); FL.store.snap = null; FL.store.code = null;
    if (r.role === 'team') {
      if (FL.me && r.code && FL.me.code !== r.code) { FL.me = null; FL.ls.del('fl_me'); }
      if (FL.me) FL.store.start(FL.me.code, 2000);
    } else if (r.role === 'screen') {
      if (r.code) FL.store.start(r.code, 1500);
    } else if (r.role === 'host') {
      if (FL.guardHostRoute(r)) { FL.store.start(FL.host.code, 1500); FL.bots.reload(); }
    }
    if (FL.store.code && !FL.useLocal && !FL._rt) { FL._rt = true; FL.store.enableRealtime(FL.cfg); }
    FL.render(true);
  };

  FL.onShiftState = function () { FL.render(false); };

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.disabled) return;
    var r = FL.route();
    if (r.role === 'host' && !FL.guardHostRoute(r) && ['hcreate','hresume','hlogout','lang'].indexOf(b.dataset.act) < 0) { FL.render(true); return; }
    var f = FL.acts[b.dataset.act];
    if (f) {
      var result = f(b, e);
      if (result && typeof result.then === 'function') {
        b.disabled = true; b.setAttribute('aria-busy', 'true');
        result.finally(function () { b.disabled = false; b.removeAttribute('aria-busy'); });
      }
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, name = el && el.dataset && el.dataset.change;
    if (name && FL.route().role === 'host' && !FL.guardHostRoute(FL.route())) { FL.render(true); return; }
    if (name && FL.changes[name]) FL.changes[name](el, e);
  });

  document.documentElement.lang = FL.lang === 'zh' ? 'zh-Hant' : 'en'; document.title = FL.t('doc_title');
  FL.boot();
})();

</script>
</body>
</html>
